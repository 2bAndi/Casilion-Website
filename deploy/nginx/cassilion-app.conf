# /etc/nginx/snippets/cassilion-app.conf
# Everything the app needs inside a "server { ... }": compression, the request
# limit and the proxy to the container. Used by deploy/nginx/cassilion.com.

# Ubuntu's nginx compresses only HTML
gzip on;
gzip_proxied any;
gzip_types application/json text/plain text/css application/javascript image/svg+xml;

# Requests per visitor: a person or an AI agent never comes near it, a script does.
# Needs the limit_req_zone line in /etc/nginx/conf.d/cassilion-rate.conf (docs/server-setup.md, section 2).
limit_req_status 429;

# Password in front of the site while it is not public (docs/server-setup.md, section 2):
#   sudo htpasswd -c /etc/nginx/.htpasswd-cassilion <name>
# To open the site, comment out the two auth_basic lines in "location /" and reload nginx.
location / {
    auth_basic "Cassilion";
    auth_basic_user_file /etc/nginx/.htpasswd-cassilion;
    limit_req zone=cassilion_rate burst=60 nodelay;
    proxy_pass http://127.0.0.1:8150;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance;
}

# The MCP endpoints stay outside the password: an AI agent signs in with its own token in the
# Authorization header, and that header cannot carry the nginx password as well.
location ~ ^/(mcp|ops/mcp|\.well-known/oauth-protected-resource)(/|$) {
    limit_req zone=cassilion_rate burst=60 nodelay;
    proxy_pass http://127.0.0.1:8150;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 2m;
}

# The payment webhooks stay outside the password as well: Stripe and PayPal cannot send it.
# Every message is checked by its signature in the application; unsigned ones are answered with 400.
location ~ ^/billing/webhook/(stripe|paypal)/$ {
    limit_req zone=cassilion_rate burst=60 nodelay;
    proxy_pass http://127.0.0.1:8150;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}

# While the container restarts: "503, try again shortly"
location @maintenance {
    default_type text/html;
    add_header Retry-After 300 always;
    return 503 "<!doctype html><meta charset=utf-8><title>Cassilion</title><p>Cassilion is being updated. Please try again in a few minutes.</p>";
}
