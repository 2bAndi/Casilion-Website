<defs><marker id="ah-ctx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cd-head"/></marker></defs>
<rect x="0" y="0" width="1200" height="690" class="cd-bg"/>
