<path d="M410,521 L378,521 L378,280 L390,280" class="cd-line" marker-end="url(#ah-ctx)"/>
<text x="356" y="452" class="cd-lab" text-anchor="middle" transform="rotate(-90 356 452)">pulls jobs · returns drafts</text>
<text x="30" y="676" class="cd-note" text-anchor="start">Arrows point from the side that opens the connection. Dashed: carried by the customer inside a ticket. Amber: third-party services. Green: operator side.</text>
