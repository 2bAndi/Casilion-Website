<text x="1065.0" y="421.5" class="cd-sub" text-anchor="middle">VPN / allow-list + MFA</text>
<rect x="960" y="564" width="210" height="62" rx="8" class="cd-opsbox"/>
<text x="1065.0" y="591.5" class="cd-title" text-anchor="middle">Product repo, docs &amp; CI</text>
<text x="1065.0" y="608.5" class="cd-sub" text-anchor="middle">private Git · signed builds</text>
