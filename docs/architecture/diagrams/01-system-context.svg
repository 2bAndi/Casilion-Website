<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 690" width="1200" height="690" class="cdg" role="img" aria-labelledby="t-ctx d-ctx">
<title id="t-ctx">Cassilion web platform - system context</title>
<desc id="d-ctx">Visitors, customers, customer AI agents and the installed Cassilion database on the left; the web platform with its isolated AI support enclave in the centre; payment provider, e-mail delivery, operators and the product repository on the right.</desc>
<style>
