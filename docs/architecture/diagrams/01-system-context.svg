<text x="135.0" y="124.5" class="cd-title" text-anchor="middle">Visitor</text>
<text x="135.0" y="141.5" class="cd-sub" text-anchor="middle">anonymous · reads site and docs</text>
<rect x="30" y="170" width="210" height="56" rx="8" class="cd-ext"/>
