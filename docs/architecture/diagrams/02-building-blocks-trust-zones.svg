<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" class="cdg" role="img" aria-labelledby="t-blk d-blk">
<title id="t-blk">Cassilion web platform - building blocks and trust zones</title>
<desc id="d-blk">Internet clients reach a reverse proxy, which fronts a Django modular monolith in the application zone. An isolated AI support enclave pulls jobs through a narrow job API. Operators and the product Git/CI form a separate zone.</desc>
