<text x="262" y="189" class="cd-sub" text-anchor="start">TLS · rate limits · body-size limits · security headers / CSP · separate host names: www · mcp · ops</text>
<path d="M600,206 L600,232" class="cd-line" marker-end="url(#ah-blk)"/>
<rect x="30" y="232" width="1140" height="304" rx="10" class="cd-z-app"/>
<text x="46" y="254" class="cd-zone cd-zc-app" text-anchor="start">APPLICATION ZONE — DJANGO MODULAR MONOLITH (ONE CODEBASE, ONE IMAGE)</text>
<rect x="46" y="268" width="208" height="72" rx="8" class="cd-box"/>
<text x="150.0" y="293.0" class="cd-title" text-anchor="middle">web</text>
<text x="150.0" y="310.0" class="cd-sub" text-anchor="middle">public site · docs · i18n</text>
<text x="150.0" y="325.0" class="cd-sub" text-anchor="middle">pricing · legal pages</text>
<rect x="270" y="268" width="208" height="72" rx="8" class="cd-box"/>
<text x="374.0" y="293.0" class="cd-title" text-anchor="middle">accounts</text>
<text x="374.0" y="310.0" class="cd-sub" text-anchor="middle">users · organisations · roles</text>
<text x="374.0" y="325.0" class="cd-sub" text-anchor="middle">addresses · MFA · consents</text>
<rect x="494" y="268" width="208" height="72" rx="8" class="cd-box"/>
<text x="598.0" y="293.0" class="cd-title" text-anchor="middle">billing</text>
<text x="598.0" y="310.0" class="cd-sub" text-anchor="middle">plans · orders · subscriptions</text>
<text x="598.0" y="325.0" class="cd-sub" text-anchor="middle">provider adapter · webhooks</text>
<rect x="718" y="268" width="208" height="72" rx="8" class="cd-box"/>
