<text x="600.0" y="116.5" class="cd-sub" text-anchor="middle">customers&#x27; AI agents</text>
<path d="M600,128 L600,162" class="cd-line" marker-end="url(#ah-blk)"/>
<rect x="794" y="78" width="360" height="50" rx="8" class="cd-box"/>
<text x="974.0" y="99.5" class="cd-title" text-anchor="middle">Payment provider</text>
<text x="974.0" y="116.5" class="cd-sub" text-anchor="middle">signed webhooks</text>
<path d="M974,128 L974,162" class="cd-line" marker-end="url(#ah-blk)"/>
<rect x="30" y="162" width="1140" height="44" rx="8" class="cd-box"/>
