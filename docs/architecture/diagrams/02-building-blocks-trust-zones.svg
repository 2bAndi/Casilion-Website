<text x="598.0" y="411.0" class="cd-sub" text-anchor="middle">OAuth 2.1 resource server</text>
<rect x="718" y="354" width="208" height="72" rx="8" class="cd-box"/>
<text x="822.0" y="379.0" class="cd-title" text-anchor="middle">backoffice</text>
<text x="822.0" y="396.0" class="cd-sub" text-anchor="middle">review queue · sent log</text>
<text x="822.0" y="411.0" class="cd-sub" text-anchor="middle">bug alerts · kill switch</text>
<rect x="942" y="354" width="208" height="72" rx="8" class="cd-box"/>
<text x="1046.0" y="379.0" class="cd-title" text-anchor="middle">audit</text>
<text x="1046.0" y="396.0" class="cd-sub" text-anchor="middle">append-only event log</text>
<text x="1046.0" y="411.0" class="cd-sub" text-anchor="middle">who did what, acting as whom</text>
<text x="46" y="449" class="cd-sub" text-anchor="start">Runtime services</text>
<rect x="46" y="458" width="208" height="58" rx="8" class="cd-guard"/>
