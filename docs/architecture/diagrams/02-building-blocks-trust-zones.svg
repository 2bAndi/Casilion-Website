<text x="374.0" y="483.5" class="cd-title" text-anchor="middle">PostgreSQL</text>
<text x="374.0" y="500.5" class="cd-sub" text-anchor="middle">customers · orders · tickets</text>
<rect x="494" y="458" width="208" height="58" rx="8" class="cd-infra"/>
<text x="598.0" y="483.5" class="cd-title" text-anchor="middle">Task queue + worker</text>
<text x="598.0" y="500.5" class="cd-sub" text-anchor="middle">mail · webhooks · issuing</text>
<rect x="718" y="458" width="208" height="58" rx="8" class="cd-infra"/>
<text x="822.0" y="483.5" class="cd-title" text-anchor="middle">License signer</text>
<text x="822.0" y="500.5" class="cd-sub" text-anchor="middle">Ed25519 key, not in the repo</text>
<rect x="942" y="458" width="208" height="58" rx="8" class="cd-infra"/>
<text x="1046.0" y="483.5" class="cd-title" text-anchor="middle">Object storage</text>
<text x="1046.0" y="500.5" class="cd-sub" text-anchor="middle">release artefacts · attachments</text>
<rect x="30" y="566" width="720" height="276" rx="10" class="cd-z-ai"/>
<text x="734" y="588" class="cd-zone cd-zc-ai" text-anchor="end">AI SUPPORT ENCLAVE — NO INBOUND PORT · NO INTERNET EGRESS</text>
<rect x="46" y="602" width="160" height="64" rx="8" class="cd-box"/>
<text x="126.0" y="623.0" class="cd-title" text-anchor="middle">AI worker</text>
