<text x="1046.0" y="325.0" class="cd-sub" text-anchor="middle">expiring links · checksums</text>
<rect x="46" y="354" width="208" height="72" rx="8" class="cd-box"/>
<text x="150.0" y="379.0" class="cd-title" text-anchor="middle">support</text>
<text x="150.0" y="396.0" class="cd-sub" text-anchor="middle">tickets · state machine</text>
<text x="150.0" y="411.0" class="cd-sub" text-anchor="middle">quotas · release gate</text>
