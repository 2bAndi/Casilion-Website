<text x="822.0" y="310.0" class="cd-sub" text-anchor="middle">entitlements · signed license</text>
<text x="822.0" y="325.0" class="cd-sub" text-anchor="middle">files · key ids · revocation</text>
<rect x="942" y="268" width="208" height="72" rx="8" class="cd-box"/>
