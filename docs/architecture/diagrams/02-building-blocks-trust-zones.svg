<text x="374.0" y="379.0" class="cd-title" text-anchor="middle">guard</text>
<text x="374.0" y="396.0" class="cd-sub" text-anchor="middle">input guardrails: normalise</text>
<text x="374.0" y="411.0" class="cd-sub" text-anchor="middle">redact · classify · decide</text>
