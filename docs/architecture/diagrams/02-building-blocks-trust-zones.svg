<text x="300.0" y="640.0" class="cd-sub" text-anchor="middle">docs + source code</text>
<text x="300.0" y="655.0" class="cd-sub" text-anchor="middle">→ structured finding</text>
<rect x="394" y="602" width="160" height="64" rx="8" class="cd-guard"/>
<text x="474.0" y="623.0" class="cd-title" text-anchor="middle">Bridge</text>
<text x="474.0" y="640.0" class="cd-sub" text-anchor="middle">schema-only hand-over</text>
<text x="474.0" y="655.0" class="cd-sub" text-anchor="middle">no source text crosses</text>
<rect x="568" y="602" width="160" height="64" rx="8" class="cd-box"/>
<text x="648.0" y="623.0" class="cd-title" text-anchor="middle">Responder</text>
<text x="648.0" y="640.0" class="cd-sub" text-anchor="middle">public docs only</text>
<text x="648.0" y="655.0" class="cd-sub" text-anchor="middle">→ draft reply</text>
<rect x="46" y="682" width="160" height="64" rx="8" class="cd-box"/>
<text x="126.0" y="703.0" class="cd-title" text-anchor="middle">Evaluation set</text>
<text x="126.0" y="720.0" class="cd-sub" text-anchor="middle">golden tickets</text>
<text x="126.0" y="735.0" class="cd-sub" text-anchor="middle">regression runs</text>
<rect x="220" y="682" width="334" height="64" rx="8" class="cd-box"/>
<text x="387.0" y="710.5" class="cd-title" text-anchor="middle">LLM runtime (Ollama / vLLM)</text>
<text x="387.0" y="727.5" class="cd-sub" text-anchor="middle">OpenAI-compatible gateway · model swap by config</text>
<rect x="568" y="682" width="160" height="64" rx="8" class="cd-guard"/>
<text x="648.0" y="703.0" class="cd-title" text-anchor="middle">Output guard</text>
<text x="648.0" y="720.0" class="cd-sub" text-anchor="middle">DLP · fingerprint · canary</text>
<text x="648.0" y="735.0" class="cd-sub" text-anchor="middle">grounding · policy judge</text>
<rect x="46" y="762" width="682" height="64" rx="8" class="cd-box"/>
<text x="387.0" y="790.5" class="cd-title" text-anchor="middle">Knowledge index</text>
<text x="387.0" y="807.5" class="cd-sub" text-anchor="middle">public corpus: docs, release notes, known issues  ·  internal corpus: source snapshot per release tag, design notes</text>
