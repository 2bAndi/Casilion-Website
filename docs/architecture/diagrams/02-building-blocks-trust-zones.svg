<text x="30" y="866" class="cd-note" text-anchor="start">Red outline: guardrail or controlled crossing point. Dashed: runtime services. Arrows point from the side that opens the connection: the enclave fetches jobs and repo snapshots itself; nothing connects into it.</text>
