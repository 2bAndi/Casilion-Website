<defs><marker id="ah-env" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="cd-head"/></marker></defs>
<rect x="0" y="0" width="1200" height="560" class="cd-bg"/>
<text x="30" y="30" class="cd-fig" text-anchor="start">Figure 10 — Environments: local first, then production</text>
<rect x="30" y="48" width="470" height="452" rx="10" class="cd-z-ext"/>
<text x="46" y="70" class="cd-zone cd-zc-ext" text-anchor="start">LOCAL DEVELOPMENT — WINDOWS 11 + DOCKER COMPOSE</text>
<rect x="44" y="82" width="442" height="216" rx="10" class="cd-z-app"/>
<text x="58" y="103" class="cd-zone cd-zc-app" text-anchor="start">APP SERVICES</text>
<rect x="58" y="114" width="202" height="50" rx="8" class="cd-box"/>
<text x="159.0" y="135.5" class="cd-title" text-anchor="middle">web</text>
<text x="159.0" y="152.5" class="cd-sub" text-anchor="middle">Django with hot reload</text>
<rect x="270" y="114" width="202" height="50" rx="8" class="cd-box"/>
<text x="371.0" y="135.5" class="cd-title" text-anchor="middle">worker</text>
<text x="371.0" y="152.5" class="cd-sub" text-anchor="middle">task queue</text>
<rect x="58" y="172" width="202" height="50" rx="8" class="cd-infra"/>
<text x="159.0" y="193.5" class="cd-title" text-anchor="middle">PostgreSQL + pgvector</text>
<text x="159.0" y="210.5" class="cd-sub" text-anchor="middle">one container</text>
<rect x="270" y="172" width="202" height="50" rx="8" class="cd-box"/>
<text x="371.0" y="193.5" class="cd-title" text-anchor="middle">Mailpit</text>
<text x="371.0" y="210.5" class="cd-sub" text-anchor="middle">catches all outgoing mail</text>
<rect x="58" y="230" width="202" height="50" rx="8" class="cd-infra"/>
<text x="159.0" y="251.5" class="cd-title" text-anchor="middle">MinIO</text>
<text x="159.0" y="268.5" class="cd-sub" text-anchor="middle">release artefacts</text>
<rect x="270" y="230" width="202" height="50" rx="8" class="cd-box"/>
<text x="371.0" y="251.5" class="cd-title" text-anchor="middle">Payment sandbox</text>
<text x="371.0" y="268.5" class="cd-sub" text-anchor="middle">test checkout + webhook forwarder</text>
<rect x="44" y="334" width="442" height="152" rx="10" class="cd-z-ai"/>
<text x="472" y="355" class="cd-zone cd-zc-ai" text-anchor="end">AI SERVICES</text>
<rect x="58" y="366" width="202" height="50" rx="8" class="cd-box"/>
<text x="159.0" y="387.5" class="cd-title" text-anchor="middle">ai-worker</text>
<text x="159.0" y="404.5" class="cd-sub" text-anchor="middle">same image as production</text>
<rect x="270" y="366" width="202" height="50" rx="8" class="cd-box"/>
<text x="371.0" y="387.5" class="cd-title" text-anchor="middle">Ollama</text>
<text x="371.0" y="404.5" class="cd-sub" text-anchor="middle">on the GPU workstation (LAN)</text>
<rect x="58" y="424" width="414" height="50" rx="8" class="cd-infra"/>
<text x="265.0" y="445.5" class="cd-title" text-anchor="middle">Knowledge index</text>
<text x="265.0" y="462.5" class="cd-sub" text-anchor="middle">built from a local checkout of the product repo</text>
<path d="M159,366 L159,298" class="cd-line" marker-end="url(#ah-env)"/>
<rect x="166" y="309" width="192.4" height="16" rx="3" class="cd-lbg"/>
<text x="171" y="321" class="cd-lab" text-anchor="start">pulls jobs — outbound HTTPS only</text>
<rect x="700" y="48" width="470" height="452" rx="10" class="cd-z-ext"/>
<text x="716" y="70" class="cd-zone cd-zc-ext" text-anchor="start">PRODUCTION</text>
<rect x="714" y="82" width="442" height="216" rx="10" class="cd-z-app"/>
<text x="728" y="103" class="cd-zone cd-zc-app" text-anchor="start">APP SERVER (EU)</text>
<rect x="728" y="114" width="202" height="50" rx="8" class="cd-box"/>
<text x="829.0" y="135.5" class="cd-title" text-anchor="middle">Caddy</text>
<text x="829.0" y="152.5" class="cd-sub" text-anchor="middle">TLS · rate limits · host names</text>
<rect x="940" y="114" width="202" height="50" rx="8" class="cd-box"/>
<text x="1041.0" y="135.5" class="cd-title" text-anchor="middle">web</text>
<text x="1041.0" y="152.5" class="cd-sub" text-anchor="middle">Django on ASGI</text>
<rect x="728" y="172" width="202" height="50" rx="8" class="cd-box"/>
<text x="829.0" y="193.5" class="cd-title" text-anchor="middle">worker</text>
<text x="829.0" y="210.5" class="cd-sub" text-anchor="middle">task queue</text>
<rect x="940" y="172" width="202" height="50" rx="8" class="cd-infra"/>
<text x="1041.0" y="193.5" class="cd-title" text-anchor="middle">PostgreSQL</text>
<text x="1041.0" y="210.5" class="cd-sub" text-anchor="middle">nightly backup, off-site copy</text>
<rect x="728" y="230" width="202" height="50" rx="8" class="cd-infra"/>
<text x="829.0" y="251.5" class="cd-title" text-anchor="middle">Object storage</text>
<text x="829.0" y="268.5" class="cd-sub" text-anchor="middle">release artefacts</text>
<rect x="940" y="230" width="202" height="50" rx="8" class="cd-box"/>
<text x="1041.0" y="251.5" class="cd-title" text-anchor="middle">Monitoring</text>
<text x="1041.0" y="268.5" class="cd-sub" text-anchor="middle">errors · uptime · site_status</text>
<rect x="714" y="334" width="442" height="152" rx="10" class="cd-z-ai"/>
<text x="1142" y="355" class="cd-zone cd-zc-ai" text-anchor="end">AI NODE — OWN GPU OR DEDICATED SERVER</text>
<rect x="728" y="366" width="202" height="50" rx="8" class="cd-box"/>
<text x="829.0" y="387.5" class="cd-title" text-anchor="middle">ai-worker</text>
<text x="829.0" y="404.5" class="cd-sub" text-anchor="middle">no inbound port</text>
<rect x="940" y="366" width="202" height="50" rx="8" class="cd-box"/>
<text x="1041.0" y="387.5" class="cd-title" text-anchor="middle">LLM runtime</text>
<text x="1041.0" y="404.5" class="cd-sub" text-anchor="middle">Ollama / vLLM</text>
<rect x="728" y="424" width="414" height="50" rx="8" class="cd-infra"/>
<text x="935.0" y="445.5" class="cd-title" text-anchor="middle">Knowledge index + repo snapshot</text>
<text x="935.0" y="462.5" class="cd-sub" text-anchor="middle">the private source lives only here</text>
<path d="M829,366 L829,298" class="cd-line" marker-end="url(#ah-env)"/>
<rect x="836" y="309" width="192.4" height="16" rx="3" class="cd-lbg"/>
<text x="841" y="321" class="cd-lab" text-anchor="start">pulls jobs — outbound HTTPS only</text>
<rect x="530" y="222" width="140" height="104" rx="8" class="cd-opsbox"/>
<text x="600.0" y="255.5" class="cd-title" text-anchor="middle">Git + CI</text>
<text x="600.0" y="272.5" class="cd-sub" text-anchor="middle">tests · image build</text>
<text x="600.0" y="287.5" class="cd-sub" text-anchor="middle">guardrail regression</text>
<text x="600.0" y="302.5" class="cd-sub" text-anchor="middle">on golden tickets</text>
<path d="M500,250 L530,250" class="cd-line" marker-end="url(#ah-env)"/>
<path d="M670,250 L700,250" class="cd-line" marker-end="url(#ah-env)"/>
<text x="600" y="212" class="cd-lab" text-anchor="middle">git push → same images →</text>
<text x="30" y="524" class="cd-note" text-anchor="start">Staging is the production Compose file on a second small host. Settings come from environment variables; secrets and the license signing key never live in the repo.</text>
<text x="30" y="544" class="cd-note" text-anchor="start">The AI zone has the same shape everywhere, so the pull-only rule is exercised from the first local run.</text>
</svg>
