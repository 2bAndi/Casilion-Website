<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" class="cdg" role="img" aria-labelledby="t-env d-env">
<title id="t-env">Cassilion web platform - local development and production environments</title>
<desc id="d-env">The same container images run locally under Docker Compose and in production. In both, an AI worker in its own zone pulls jobs from the web application; production splits into an app server and an AI node.</desc>
<style>
